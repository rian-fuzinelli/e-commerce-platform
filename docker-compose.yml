services:
  postgres:
    image: postgres:17-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Sem healthcheck a API sobe antes do banco aceitar conexões e quebra no start.
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog-api:
    build:
      context: .
      dockerfile: src/Catalog.Api/Dockerfile
    container_name: ecommerce-catalog-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Dentro da rede do compose o host do banco é o nome do serviço, não localhost.
      ConnectionStrings__Catalog: "Host=postgres;Port=5432;Database=ecommerce;Username=postgres;Password=postgres"
    ports:
      - "5080:8080"

volumes:
  postgres-data:
